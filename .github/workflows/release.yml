name: Signed Release

on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==9.1.1

      - name: Run release checks
        run: python release_check.py .

      - name: Run Python tests
        run: python -m pytest -q

      - name: Build clean release archive
        run: python scripts/build_release.py --version "${GITHUB_REF_NAME#v}" --output dist/release

      - name: Sign release manifest
        env:
          ZERO_SCRIPT_SIGNING_PRIVATE_KEY: ${{ secrets.ZERO_SCRIPT_SIGNING_PRIVATE_KEY }}
        run: python scripts/sign_release.py --version "${GITHUB_REF_NAME#v}" --archive "dist/release/ZeroScript-Free-${GITHUB_REF_NAME}.zip" --output dist/release/signed

      - name: Verify release manifest and signature
        env:
          ZERO_SCRIPT_SIGNING_PRIVATE_KEY: ${{ secrets.ZERO_SCRIPT_SIGNING_PRIVATE_KEY }}
        run: |
          python scripts/sign_release.py --version "${GITHUB_REF_NAME#v}" --archive "dist/release/ZeroScript-Free-${GITHUB_REF_NAME}.zip" --output dist/release/verify
          cmp dist/release/signed/release-manifest.json dist/release/verify/release-manifest.json
          cmp dist/release/signed/release-manifest.sig dist/release/verify/release-manifest.sig

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/ZeroScript-Free-${GITHUB_REF_NAME}.zip" \
            "dist/release/signed/release-manifest.json" \
            "dist/release/signed/release-manifest.sig" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
